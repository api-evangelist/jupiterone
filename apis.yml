aid: jupiterone
name: JupiterOne
description: 'JupiterOne is a cyber asset attack surface management (CAASM) and security
  asset intelligence platform that maps an organization''s entire digital environment
  — cloud resources, devices, users, code repositories, findings, and the relationships
  between them — into a single queryable graph. Its public GraphQL API and the J1QL
  query language let teams query the graph, create and mutate entities and relationships,
  ingest data through sync jobs, run alert rules with webhook/SNS/SQS/Slack/Jira actions,
  manage IAM and questions, and automate compliance evidence collection. JupiterOne
  was founded in 2018 and is headquartered in Morrisville, North Carolina.'
